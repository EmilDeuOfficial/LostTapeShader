# Explizite Dimension-Zuordnung (neuere Iris/Oculus-Versionen brauchen das,
# damit die world-Ordner sicher greifen)
# world0 faengt mit * auch ALLE Mod-Dimensionen auf — sonst laufen diese
# ohne Zuordnung und Effekte wie das Hand-Licht fallen dort aus
dimension.world0=minecraft:overworld *
dimension.world-1=minecraft:the_nether
dimension.world1=minecraft:the_end
