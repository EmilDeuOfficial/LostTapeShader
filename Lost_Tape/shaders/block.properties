# Block-IDs fuer den Shader (Iris/Oculus)
# Echtes Wasser bekommt ID 8 — nur darauf wirkt die Wasser-Deckkraft,
# andere Transluzente (Nether-Portal, Glas) behalten ihre Vanilla-Deckkraft
# hohe IDs, um Kollisionen mit den Legacy-Block-IDs (Wasser war frueher 8/9)
# zu vermeiden — niedrige IDs koennen je nach Loader falsch matchen
block.10008=minecraft:water minecraft:flowing_water
# Nether-Portal — wird im Shader deutlich deckender und farbstaerker gemacht
block.10009=minecraft:nether_portal
