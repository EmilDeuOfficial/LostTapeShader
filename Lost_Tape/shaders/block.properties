# Block-IDs fuer den Shader (Iris/Oculus)
# Echtes Wasser bekommt ID 8 — nur darauf wirkt die Wasser-Deckkraft,
# andere Transluzente (Nether-Portal, Glas) behalten ihre Vanilla-Deckkraft
block.8=minecraft:water minecraft:flowing_water
# Nether-Portal bekommt ID 9 — wird im Shader deutlich deckender gemacht
block.9=minecraft:nether_portal
